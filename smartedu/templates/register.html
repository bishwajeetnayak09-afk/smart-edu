{% extends "base.html" %}

{% block title %}Student Registration - SmartEdu{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto my-6 space-y-6">

    <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
        <div class="text-center mb-6">
            <div class="w-12 h-12 rounded-xl bg-brand-600 text-white mx-auto flex items-center justify-center text-xl shadow-md shadow-brand-500/20 mb-3">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900">Create Student Account</h1>
            <p class="text-xs text-slate-500 mt-1">Enroll in classes, access study materials, and unlock AI assistance</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}" class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="full_name" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Full Name</label>
                    <input type="text" id="full_name" name="full_name" required
                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
                        placeholder="e.g. Alex Mercer">
                </div>
                <div>
                    <label for="roll_number" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Roll / Student ID</label>
                    <input type="text" id="roll_number" name="roll_number" required
                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
                        placeholder="e.g. STU-2024-005">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="username" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Username</label>
                    <input type="text" id="username" name="username" required
                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
                        placeholder="e.g. alex_m">
                </div>
                <div>
                    <label for="email" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Email Address</label>
                    <input type="email" id="email" name="email" required
                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
                        placeholder="e.g. alex@smartedu.edu">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Password</label>
                    <input type="password" id="password" name="password" required
                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
                        placeholder="••••••••">
                </div>
                <div>
                    <label for="semester" class="block text-xs font-semibold text-slate-700 uppercase mb-1">Semester</label>
                    <select id="semester" name="semester" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 bg-white">
                        <option value="1">Semester 1</option>
                        <option value="2">Semester 2</option>
                        <option value="3">Semester 3</option>
                        <option value="4">Semester 4</option>
                        <option value="5" selected>Semester 5</option>
                        <option value="6">Semester 6</option>
                        <option value="7">Semester 7</option>
                        <option value="8">Semester 8</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-2">Enroll in Subjects</label>
                <div class="space-y-2 max-h-40 overflow-y-auto border border-slate-200 rounded-xl p-3 bg-slate-50/50">
                    {% for subj in subjects %}
                    <label class="flex items-center space-x-3 p-1.5 rounded-lg hover:bg-white cursor-pointer transition">
                        <input type="checkbox" name="subject_ids" value="{{ subj.id }}" checked
                            class="w-4 h-4 text-brand-600 rounded border-slate-300 focus:ring-brand-500">
                        <div class="text-xs">
                            <span class="font-bold text-slate-800">{{ subj.code }}</span> - {{ subj.name }}
                            <span class="text-slate-400">({{ subj.credits }} credits)</span>
                        </div>
                    </label>
                    {% endfor %}
                </div>
            </div>

            <button type="submit"
                class="w-full py-3 px-4 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm shadow-md shadow-brand-500/20 transition flex items-center justify-center space-x-2">
                <span>Create Student Account</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-500">
                Already registered?
                <a href="{{ url_for('login') }}" class="font-semibold text-brand-600 hover:text-brand-700 ml-1">Sign in here</a>
            </p>
        </div>
    </div>

</div>
{% endblock %}
